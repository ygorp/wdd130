<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário sobre html e css</title>
  <link rel="stylesheet" href="/estilos/questionario.css">
</head>
<body>
  <h1>Formulário sobre HTML e CSS</h1>

  <form>
    <label for="q1">Como apontar um arquivo CSS no HTML?</label>
    <input type="text" id="q1" name="q1" required>
    <label for="q2">O que é o box model no CSS?</label>
    <textarea id="q2" name="q2" required></textarea>
    <label for="q3">Quais são as principais tags de estruturação em HTML?</label>
    <select id="q3" name="q3" required>
      <option value="">Selecione uma opção</option>
      <option value="a">div, span, p</option>
      <option value="b">header, nav, main, footer</option>
      <option value="c">h1, h2, h3</option>
    </select>
    <label for="q4">Quantas propriedades CSS de posicionamento (position) existem no total?</label>
    <input type="number" id="q4" name="q4" required>
    <button type="submit">Enviar Questionário</button>
  </form>
</body>
</html>
